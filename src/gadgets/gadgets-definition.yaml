        - SonglistSheet.less
      resourceLoader:
        hidden: true
        dependencies:
          - ext.gadget.jspreadsheet
          - ext.gadget.SonglistCRUD
    SonglistMobile:
      description: "The songlist rules that must reach mobile view: list styles and the desktop/mobile container toggles. Styles only."
      authors:
        - Ark
      comment: |
        Styles only, deliberately. A gadget carrying JS does not deliver its
        stylesheet to mobile view, which is why the songlist list styles and the
        desktop/mobile container toggles cannot live in SonglistCRUD. Do not add
        a .js file to this line.
      code:
        - SonglistMobile.less
      resourceLoader:
        default: true
        hidden: true
        type: styles
    UptodateEditor:
      description: "Button + modal to update {{Uptodate}} parameters on song lists."
