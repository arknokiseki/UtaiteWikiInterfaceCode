          - mediawiki.util
          - mediawiki.user
        actions:
          - view
        namespaces:
          - 0

  libraries:
    jspreadsheet:
      description: "jsuites + jspreadsheet-ce (vendor builds from jsDelivr), for SonglistSheet."
      links:
        - https://cdn.jsdelivr.net/npm/jsuites@5.13.5/dist/jsuites.js
        - https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5.0.4/dist/index.js
      comment: |
        Loaded on demand only. NOT `default`: ResourceLoader registers these as
        modules but never delivers them, so ordinary artist page views (and all
        mobile views) never fetch the ~340 KB. Gadget-SonglistCRUD.js pulls them
        with mw.loader.using() on first click of the Spreadsheet button.
        jsuites MUST precede jspreadsheet: the bundle's require('jsuites')
        fallback does not work in a browser.
      code:
        - jsuites.js
        - jsuites.css
        - jspreadsheet-ce.js
        - jspreadsheet-ce.css
      verbatim:
        - jsuites.js
        - jsuites.css
        - jspreadsheet-ce.js
        - jspreadsheet-ce.css
      resourceLoader:
        hidden: true

