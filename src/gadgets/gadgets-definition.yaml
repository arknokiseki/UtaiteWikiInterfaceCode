          - mediawiki.user
          - jquery
        default: true
        hidden: true
    SonglistSheet:
      description: "Spreadsheet editor for <Artist>/Songs/songs.json, lazy-loaded by SonglistCRUD on first click of its Spreadsheet button."
      authors:
        - Ark
      code:
